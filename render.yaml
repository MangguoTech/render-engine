services:
  - type: web
    name: easytier-mesh
    env: docker
    plan: free
    region: oregon # or singapore / frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ET_NAME
        value: render-mesh
      - key: ET_SECRET
        generateValue: true
      - key: ET_IP
        value: 10.144.144.10
      - key: ET_HOSTNAME
        value: render-box
      - key: ET_PEERS
        value: "" # Optional: e.g. "tcp://your-vps.com:11010"
      - key: SSH_PASS
        generateValue: true
      - key: SSH_PUBKEY
        value: "" # Optional: Paste your ~/.ssh/id_ed25519.pub content here
      - key: TTYD_USER
        value: admin
      - key: TTYD_PASS
        generateValue: true
      - key: ET_LOG_LEVEL
        value: info
